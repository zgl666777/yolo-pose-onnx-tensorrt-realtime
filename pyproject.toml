[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseguard"
version = "0.1.0"
description = "YOLO Pose camera pipeline with ONNX, TensorRT and per-person fall detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.3", "opencv-python>=4.8,<4.12", "onnxruntime>=1.18,<1.23",
  "scipy>=1.11,<1.16", "scikit-learn>=1.4,<1.7", "joblib>=1.3,<1.6",
  "PyYAML>=6,<7", "psutil>=5.9,<8"
]

[project.optional-dependencies]
export = ["ultralytics>=8.3,<8.4", "onnx>=1.16,<1.19", "torch>=2.4,<2.9"]
trt = ["tensorrt>=10.0,<11", "cuda-python>=12.6,<14"]
dev = ["pytest>=8,<9", "onnx>=1.16,<1.19"]

[project.scripts]
poseguard = "poseguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
